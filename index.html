<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube Verification v9.5 </title>

<style>

body{
    margin:0;
    padding:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:350px;
    background:#1e1e1e;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h2{
    margin-bottom:20px;
}

.btn{
    background:red;
    color:white;
    padding:15px 25px;
    text-decoration:none;
    border-radius:10px;
    display:inline-block;
    font-size:18px;
    border:none;
    cursor:pointer;
}

.btn:hover{
    opacity:0.8;
}

.success{
    color:#00ff99;
    font-size:22px;
    font-weight:bold;
}

.fail{
    color:#ff4444;
    font-size:22px;
    font-weight:bold;
}

.hidden{
    display:none;
}

.subcount{
    margin-top:15px;
    font-size:18px;
    color:#ffd700;
}

</style>
</head>

<body>

<div class="box">

<div id="stepBox">

    <h2>Step 1: Subscribe</h2>

    <a class="btn"
       href="https://youtube.com/@Piro_Clasher"
       target="_blank">
       🔴 Subscribe
    </a>

    <br><br>

    <h2>Step 2: Verify</h2>

    <button class="btn" onclick="googleLogin()">
        Login with Google
    </button>

</div>

<div id="resultBox" class="hidden">

    <div id="resultText"></div>

    <div class="subcount" id="subCount"></div>

    <br><br>

    <button class="btn" onclick="resetPage()">
        Try Again
    </button>

</div>

</div>

<script>

/* ================= CONFIG ================= */

const CLIENT_ID =
"786280929254-1nmib6jgeca7bn5chb05udgl4fed056o.apps.googleusercontent.com";

const REDIRECT_URI =
"https://yt-sub-nine.vercel.app";

const CHANNEL_ID =
"UCFoARvx-M-2G37e5GO036qA";

const API_KEY =
"AIzaSyBU67a5wHBwt16Pty6HcL_Cb0XbYXIYFpI";

/* ===== TELEGRAM BOT TOKEN ===== */

const BOT_TOKEN =
"8935826479:AAHTl1jOeQ9675kqnznebHT9LvHghI0xK7M";

/* ================= TELEGRAM CHECK ================= */

const urlParams = new URLSearchParams(window.location.search);

let tg = urlParams.get("tg");

if(!tg){
    tg = localStorage.getItem("tg");
}else{
    localStorage.setItem("tg", tg);
}

if(!tg){

    document.body.innerHTML = `
        <h1 style="color:red;text-align:center;margin-top:100px;">
            ❌ Open this from Telegram bot only
        </h1>
    `;
}

/* ================= GOOGLE LOGIN ================= */

function googleLogin(){

    const scope =
    "openid email https://www.googleapis.com/auth/youtube.readonly";

    const authUrl =
    "https://accounts.google.com/o/oauth2/v2/auth"
    + "?client_id=" + encodeURIComponent(CLIENT_ID)
    + "&redirect_uri=" + encodeURIComponent(REDIRECT_URI)
    + "&response_type=token"
    + "&scope=" + encodeURIComponent(scope)
    + "&prompt=consent";

    window.location.href = authUrl;
}

/* ================= PAGE LOAD ================= */

window.onload = async function(){

    if(window.location.hash){

        const hash = new URLSearchParams(
            window.location.hash.substring(1)
        );

        const accessToken = hash.get("access_token");

        if(accessToken){

            verifySubscription(accessToken);
        }
    }
}

/* ================= VERIFY SUB ================= */

async function verifySubscription(token){

    try{

        const response = await fetch(
            "https://www.googleapis.com/youtube/v3/subscriptions?part=snippet&mine=true&maxResults=50",
            {
                headers:{
                    Authorization:"Bearer " + token
                }
            }
        );

        const data = await response.json();

        let verified = false;

        if(data.items){

            data.items.forEach(item => {

                if(
                    item.snippet.resourceId.channelId
                    === CHANNEL_ID
                ){
                    verified = true;
                }

            });

        }

        await getSubscriberCount();

        showResult(verified);

        sendResultToBot(verified);

    }catch(err){

        console.log(err);

        showResult(false);

        sendResultToBot(false);
    }
}

/* ================= LIVE SUB COUNT ================= */

async function getSubscriberCount(){

    try{

        const res = await fetch(
            `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${CHANNEL_ID}&key=${API_KEY}`
        );

        const data = await res.json();

        const count =
        data.items?.[0]?.statistics?.subscriberCount || "0";

        document.getElementById("subCount").innerHTML =
        `Our channel completed <b>${Number(count).toLocaleString()}</b> subscribers 🚀`;

    }catch(err){

        console.log(err);
    }
}



















    
async function sendResultToBot(verified) {
    let status = verified ? "true" : "false";

    const url =
        `https://telebotcreator.com/api/webhook/Piro_Clasher_Bot/google_verified?tg=${tg}&verified=${status}`;

    try {
        const response = await fetch(url, {
            method: "GET"
        });

        const data = await response.json();

        console.log("TBC webhook response:", data);

        if (data.ok && data.result.status === "success") {
            alert("Verification successful!");
        } else {
            alert("Verification failed: " + data.result.message);
        }

        return data;

    } catch (error) {
        console.error("Webhook request error:", error);
        alert("Could not contact bot webhook.");
    }
}







    







    

    




    


        /* ================= SHOW RESULT ================= */

function showResult(verified){

    document.getElementById("stepBox")
    .classList.add("hidden");

    document.getElementById("resultBox")
    .classList.remove("hidden");

    const resultText =
    document.getElementById("resultText");

    if(verified){

        resultText.innerHTML = `
            <function sendResultToBot(verified){

    let status = verified ? "true" : "false";

    const webhook =
    urlParams.get("webhook");

    if(!webhook){
        return;
    }

    const finalUrl =
    webhook
    + "?tg=" + encodeURIComponent(tg)
    + "&verified=" + status;

    fetch(finalUrl,{
        method:"GET",
        mode:"no-cors"
    });

}
div class="success">
                🎉 THANK YOU FOR SUBSCRIBING!
            </div>
        `;

    }else{

        resultText.innerHTML = `
            <div class="fail">
                ❌ NOT VERIFIED
                <br><br>
                Please send screenshot to bot for manual verification.
            </div>
        `;
    }
}





    
/* ================= RESET ================= */

function resetPage(){

    localStorage.removeItem("tg");

    window.location.href =
    window.location.pathname + "?tg=" + tg;
}

</script>

</body>
</html>
